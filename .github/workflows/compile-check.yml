name: Compile Check

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Compile Android client (Java)
        run: ./gradlew :TMessagesProj_App:compileAfatDebugJavaWithJavac --stacktrace --no-daemon

      - name: Unit tests (JVM)
        run: ./gradlew :TMessagesProj:testAfatDebugUnitTest --stacktrace --no-daemon
