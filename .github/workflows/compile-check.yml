name: Compile Check

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Init media modules submodule
        run: git submodule update --init --depth 1 TMessagesProj_Modules/media TMessagesProj/lib/jlatexmath

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Compile Android client (Java)
        run: ./gradlew :TMessagesProj_App:compileAfatDebugJavaWithJavac --stacktrace --no-daemon

      - name: Unit tests (JVM)
        run: ./gradlew :TMessagesProj:testDebugUnitTest --stacktrace --no-daemon
